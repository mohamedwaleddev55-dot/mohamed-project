<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Successful</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      background-color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .success-card {
      max-width: 450px;
      width: 100%;
      border-radius: 16px;
    }
    .success-icon {
      font-size: 80px;
      color: #198754;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <div class="container d-flex justify-content-center p-3">
    <div class="card success-card shadow-lg border-0 text-center p-4 p-md-5 bg-white">
      
     
      <div class="mb-4">
        <i class="fas fa-check-circle success-icon"></i>
      </div>

    
      <h2 class="fw-bold text-dark mb-2">Order Placed Successfully!</h2>
      <p class="text-muted mb-4">
        Thank you for your purchase. Your order has been received and is being processed.
      </p>


      <div class="d-grid gap-2">
        <a href="tech.html" class="btn btn-warning fw-bold py-2 fs-6 shadow-sm">
          Back to Home
        </a>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
